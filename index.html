<!DOCTYPE html>
<html lang="fr">
<head>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE télé de jeu : sobre, adulte, lisible du fond de la salle
   IDEA une émission en direct tournée dans votre vraie salle de cours
   PICTURE la salle 3D plein écran ; habillage en bandeaux vitrés type diffusion
   COLOUR graphite vitré, bleu Stuttgart, rouge Detroit, jaune signal pour l'essentiel
   TYPE Barlow Condensed (titres, chiffres) + Barlow (texte)
   LAYOUT 16:9 : marque en haut à gauche, scores en haut à droite, question en bandeau bas, QR à droite */
:root{color-scheme:dark;--glass:rgba(13,17,19,.84);--edge:rgba(255,255,255,.12);--ink:#f3f5f6;--mut:#a9b5bb;--acc:#ffd34d;--st:#3d74d6;--de:#d8453a;--ok:#2fb36a}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0;background:#0c1113;color:var(--ink);font:500 18px/1.4 Barlow,system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:14px;backdrop-filter:blur(6px)}
.cond{font-family:"Barlow Condensed",Barlow,sans-serif}
#brand{position:fixed;left:20px;top:16px;padding:8px 14px}
#brand b{display:block;font:800 clamp(18px,1.5vw,26px)/1 "Barlow Condensed",sans-serif;letter-spacing:.01em}
#brand span{color:var(--mut);font-weight:600;font-size:clamp(12px,.85vw,14px)}
#hud{position:fixed;right:24px;top:20px;display:flex;gap:10px;align-items:stretch}
.tm{display:grid;grid-template-columns:auto auto;gap:2px 14px;align-items:center;padding:8px 16px 8px 12px;border-left:6px solid var(--c)}
.tm b{grid-row:span 2;font:800 clamp(34px,3.2vw,58px)/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;min-width:1.6em;text-align:right}
.tm strong{font:700 clamp(18px,1.4vw,24px)/1 "Barlow Condensed",sans-serif}
.tm small{color:var(--mut);font-weight:600;font-size:13px}
#clock{display:grid;place-items:center;padding:6px 14px;font:700 22px/1.1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;color:var(--mut);text-align:center}
#clock em{display:block;font-style:normal;font-size:13px;font-family:Barlow,sans-serif;font-weight:600}
#ring{position:relative;width:76px;height:76px;display:none}
#ring.on{display:block}
#ring svg{width:100%;height:100%;transform:rotate(-90deg)}
#ring circle{fill:none;stroke-width:6}
#ring .trk{stroke:rgba(255,255,255,.14)}
#ring .arc{stroke:var(--acc);stroke-linecap:round;stroke-dasharray:213.6;transition:stroke-dashoffset .3s linear}
#ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 30px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
#ring.low .arc{stroke:var(--de)}
#join{position:fixed;right:24px;bottom:24px;padding:14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;transition:all .5s}
#join .qr{background:#fff;border-radius:10px;padding:8px;width:120px;aspect-ratio:1}
#join .qr svg{width:100%;height:100%;display:block}
#join b{font:800 28px/1 "Barlow Condensed",sans-serif;color:var(--acc);letter-spacing:.06em}
#join p{margin:0;color:var(--mut);font-size:14px;font-weight:600}
#join .url{color:var(--ink);font-size:13px;word-break:break-all;max-width:260px}
body.lobby #join{right:50%;bottom:50%;transform:translate(calc(50% + 24vw),50%);grid-template-columns:1fr;text-align:center;padding:24px;width:min(34vw,440px)}
body.lobby #join .qr{width:100%;max-width:340px;margin:auto}
body.lobby #join b{font-size:56px}
body.lobby #join .url{max-width:none;font-size:15px}
#lobbyL{position:fixed;left:24px;top:120px;bottom:90px;width:min(52vw,820px);padding:26px;display:none;flex-direction:column;gap:16px}
body.lobby #lobbyL{display:flex}
#lobbyL h1{margin:0;font:800 clamp(48px,5.4vw,96px)/.95 "Barlow Condensed",sans-serif;text-wrap:balance}
#lobbyL h1 em{font-style:normal;color:var(--acc)}
#lobbyL .sub{color:var(--mut);font-weight:600;font-size:clamp(15px,1.2vw,20px)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;min-height:0}
.col{border-top:4px solid var(--c);padding-top:10px;overflow:hidden;display:flex;flex-direction:column;gap:8px}
.col h3{margin:0;font:800 26px/1 "Barlow Condensed",sans-serif;display:flex;justify-content:space-between}
.col h3 span{color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;overflow:auto}
.chip{font:600 16px/1 Barlow,sans-serif;padding:7px 11px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid var(--edge);color:var(--ink);cursor:pointer}
.chip:hover{background:rgba(216,69,58,.35)}
#lower{position:fixed;left:24px;right:24px;bottom:24px;padding:18px 22px;display:none;gap:12px;flex-direction:column}
body.withjoin #lower{right:340px}
#lower.on{display:flex}
.kick{color:var(--acc);font:700 clamp(14px,1.05vw,18px)/1.2 Barlow,sans-serif}
#lower h2{margin:0;font:700 clamp(26px,2.5vw,46px)/1.08 "Barlow Condensed",sans-serif;text-wrap:balance}
#lower p.rule{margin:0;font-size:clamp(17px,1.35vw,23px);color:#dfe5e8;max-width:75ch}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.opt{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--edge);overflow:hidden}
.opt i{position:absolute;left:0;bottom:0;height:5px;background:var(--c);transition:width .6s}
.opt .l{display:grid;place-items:center;width:40px;height:40px;border-radius:8px;background:var(--c);color:#111;font:800 26px/1 "Barlow Condensed",sans-serif}
.opt span{font-weight:600;font-size:clamp(15px,1.15vw,20px);line-height:1.2}
.opt em{font-style:normal;font:700 18px/1 "Barlow Condensed",sans-serif;color:var(--mut)}
.opt.ok{background:rgba(47,179,106,.22);border-color:var(--ok)}
.opt.no{opacity:.45}
.row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.why{border-left:4px solid var(--acc);padding:4px 0 4px 14px;font-size:clamp(16px,1.25vw,21px);color:#e9eef0}
.why b{color:var(--acc)}
.big{font:800 clamp(56px,5vw,92px)/1 "Barlow Condensed",sans-serif;color:var(--acc)}
.stat{display:flex;flex-direction:column}
.stat small{color:var(--mut);font-weight:600;font-size:14px}
.stat strong{font:700 clamp(22px,1.8vw,32px)/1.1 "Barlow Condensed",sans-serif}
.meter{height:10px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;width:min(40vw,520px)}
.meter i{display:block;height:100%;background:var(--acc);transition:width .4s}
#board{position:fixed;right:24px;top:120px;width:min(26vw,360px);padding:14px 16px;display:none}
#board.on{display:block}
#board h4{margin:0 0 8px;font:700 20px/1 "Barlow Condensed",sans-serif;color:var(--mut)}
#board ol{margin:0;padding:0;list-style:none;display:grid;gap:4px}
#board li{display:grid;grid-template-columns:1.6em minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;background:rgba(255,255,255,.05);font-weight:600}
#board li b{font:800 20px/1 "Barlow Condensed",sans-serif;color:var(--mut)}
#board li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:4px solid var(--c);padding-left:8px}
#board li strong{font:700 20px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
#board li.top{background:rgba(255,211,77,.16)}
#cap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--lowerH,24px) + 18px);max-width:min(70vw,1000px);padding:12px 20px;display:none;gap:4px;flex-direction:column;border-left:6px solid var(--acc)}
#cap.on{display:flex}
#cap b{font:800 18px/1 "Barlow Condensed",sans-serif;color:var(--acc)}
#cap b small{color:var(--mut);font-family:Barlow,sans-serif;font-weight:600;font-size:13px;margin-left:8px}
#cap span{font-size:clamp(20px,1.7vw,30px);font-weight:600;line-height:1.25}
#bubbles{position:fixed;inset:0;pointer-events:none}
.bub{position:absolute;transform:translate(-50%,-100%);background:#fff;color:#111;padding:10px 14px;border-radius:12px;font:600 clamp(15px,1.2vw,20px)/1.25 Barlow,sans-serif;max-width:360px;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.bub:after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-9px;border:9px solid transparent;border-bottom:0;border-top-color:#fff}
.bub small{display:block;font:700 13px/1 Barlow,sans-serif;color:var(--c,#555);margin-bottom:3px}
#banner{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;transition:opacity .4s;opacity:0;width:max-content;max-width:90vw}
#banner.on{opacity:1}
#banner h1{margin:0;font:800 clamp(56px,7vw,128px)/.95 "Barlow Condensed",sans-serif;text-shadow:0 4px 30px rgba(0,0,0,.6)}
#banner p{margin:.3em 0 0;font:600 clamp(18px,1.7vw,28px)/1.2 Barlow,sans-serif;text-shadow:0 2px 12px rgba(0,0,0,.8)}
#ctrl{position:fixed;right:24px;bottom:24px;display:flex;opacity:.35;transition:opacity .3s;z-index:5}
#ctrl:hover,#ctrl:focus-within,body.lobby #ctrl{opacity:1}
body:not(.lobby) #ctrl{bottom:auto;top:110px}
body:not(.lobby) #join{display:none}
button{font:700 15px/1 Barlow,sans-serif;min-height:40px;padding:8px 14px;border-radius:9px;border:1px solid var(--edge);background:rgba(13,17,19,.9);color:var(--ink);cursor:pointer}
button.main{background:var(--acc);color:#111;border-color:var(--acc)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#mode{position:fixed;left:50%;top:14px;transform:translateX(-50%);font:600 13px Barlow,sans-serif;color:#111;background:var(--acc);padding:5px 12px;border-radius:99px;display:none}
#mode.on{display:block}
@media(max-width:900px){#lobbyL{width:auto;right:24px;bottom:52%}body.lobby #join{transform:translate(50%,calc(50% + 22vh));width:auto}.opts{grid-template-columns:1fr 1fr}#board{display:none!important}body.withjoin #lower{right:24px}#join{display:none}body.lobby #join{display:grid}}
</style>
</head>
<body class="lobby">
<canvas id="stage" aria-label="Salle de classe en 3D"></canvas>
<div id="bubbles"></div>
<div id="brand" class="glass"><b>Choc des cultures</b><span id="brandSub">Équipe Charlie · GIN761</span></div>
<div id="hud"><div id="teams" style="display:flex;gap:10px"></div><div id="ring" class="glass"><svg viewBox="0 0 76 76"><circle class="trk" cx="38" cy="38" r="34"/><circle class="arc" id="arc" cx="38" cy="38" r="34"/></svg><b id="ringT"></b></div><div id="clock" class="glass">00:00<em>sur 10:00</em></div></div>
<section id="lobbyL" class="glass">
  <h1>Choc des <em>cultures</em></h1>
  <div class="sub" id="lobbySub"></div>
  <div class="cols" id="lobbyCols"></div>
</section>
<aside id="join" class="glass"><div class="qr" id="qr"></div><div><p>Scannez pour jouer · code</p><b id="code">····</b><p class="url" id="url"></p><p id="count">0 joueur</p></div></aside>
<aside id="board" class="glass"><h4>Classement</h4><ol id="boardL"></ol></aside>
<section id="lower" class="glass"></section>
<div id="cap" class="glass"><b id="capN"></b><span id="capT"></span></div>
<div id="banner"><h1 id="banH"></h1><p id="banP"></p></div>
<div id="mode">Mode répétition (sans Firebase) · ajoutez des joueurs fictifs avec B</div>
<nav id="ctrl">
  <button id="bNext" class="main" title="Espace / → / télécommande">Commencer ▶</button>
</nav>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import { GAME, PROFS, LINES, FIREBASE } from './config.js?v=17';
import { connect } from './net.js?v=17';
import { keyFor, spoken, NARR } from './voices.js?v=17';
import { newGameId, answerKey, allAnswered, scoreRound, freeSpot, finalSpots, packPerson } from './logic.js?v=17';
import { createClassroom, SEATS, ZONES, LINE_Z, lineX, DOOR } from './scene.js?v=17';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ---------- salle ---------- */
let ROOM = new URLSearchParams(location.search).get('r');
try { ROOM = ROOM || localStorage.getItem('choc:hostroom'); } catch (e) { }
const newCode = () => Array.from({ length: 4 }, () => 'ABCDEFGHJKMNPQRSTUVWXYZ'[Math.floor(Math.random() * 23)]).join('');
if (!ROOM) ROOM = newCode();
try { localStorage.setItem('choc:hostroom', ROOM); } catch (e) { }
const net = await connect(ROOM);
net.clearAnswers && net.clearAnswers(); // anciennes réponses d'une partie précédente dans la même salle
if (net.mode === 'local') $('mode').classList.add('on');

const R = createClassroom($('stage'), { corners: GAME.corners, preload: ['louise', 'joe', 'leonard', 'ben', 's_ben', 's_kate', 's_jody', 's_megan', 's_suzie', 's_leonard'] });
function fit() { R.resize(innerWidth, innerHeight); }
fit(); addEventListener('resize', fit);

/* ---------- personnages fixes ---------- */
R.addPerson('M', { model: 'louise' }, { x: -2.7, z: -5.3, yaw: 0, spd: 1.2, fast: true });
R.addPerson('P', { model: 'joe' }, { x: .5, z: -5.4, yaw: 0, spd: 1.2, fast: true });
R.addPerson('K', { model: 'leonard' }, { x: 2.3, z: -4.0, yaw: Math.PI / 2 });
R.addPerson('Mi', { model: 'ben' }, { x: 4.5, z: -4.0, yaw: -Math.PI / 2 });
R.setVisible('K', false); R.setVisible('Mi', false);

/* ---------- joueurs ---------- */
let players = {};
const avatars = new Map(); // pid -> {seat}
const seatTaken = new Map();
const hash = s => { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; };
const SK = ['#f1c7a5', '#e0ac85', '#c68a62', '#8d5a3b', '#f6d5bd', '#a8704c', '#d9a07a'], HC = ['#2b1d14', '#5a3a22', '#c9a063', '#1c1c1c', '#8a3b1e', '#d9c7a0', '#3d2b20'], PA = ['#2f3a4f', '#3b3b3b', '#5b4a3a', '#28344a', '#4a4f57'];
const TOPS = [['#3d74d6', '#2f5fb8', '#5b8ee6', '#28509c', '#4a6fa8'], ['#d8453a', '#b9362d', '#e5675c', '#a32f27', '#c75048']];
const MODELS = ['s_ben', 's_kate', 's_jody', 's_megan', 's_suzie', 's_leonard'];
function lookFor(pid, team) { return { model: MODELS[hash(pid) % MODELS.length] }; }
function freeSeat(team) {
  const order = SEATS.map((s, i) => i).filter(i => !seatTaken.has(i)).sort((a, b) => team ? SEATS[b].x - SEATS[a].x : SEATS[a].x - SEATS[b].x);
  if (order.length) return order[0];
  return null;
}
function homeOf(pid) {
  const a = avatars.get(pid); if (!a) return { x: 0, z: 5 };
  if (a.seat !== null) return SEATS[a.seat];
  return { x: -5 + (hash(pid) % 100) / 10, z: 5.2 + (hash(pid) >>> 8) % 3 * .4 };
}
function goHome(pid, delay = 0) {
  const a = avatars.get(pid); if (!a) return;
  if (a.seat !== null) R.sitAt(pid, SEATS[a.seat], delay); else { const h = homeOf(pid); R.moveTo(pid, h.x, h.z, { face: Math.PI, delay }); }
}
function syncAvatars() {
  for (const [pid, p] of Object.entries(players)) {
    if (avatars.has(pid) || !p || !p.name) continue;
    const team = p.team ? 1 : 0, seat = (Number.isInteger(p.seat) && SEATS[p.seat] && !seatTaken.has(p.seat)) ? p.seat : freeSeat(team);
    if (seat !== null) seatTaken.set(seat, pid);
    if ((p.seat ?? null) !== seat) net.setPlayer(pid, { seat });
    avatars.set(pid, { seat, team });
    R.addPerson(pid, lookFor(pid, team), { x: DOOR.x + .8, z: DOOR.z, yaw: -Math.PI / 2, label: p.name, color: GAME.teams[team].color });
    R.moveTo(pid, DOOR.x, DOOR.z, { direct: true });
    setTimeout(() => goHome(pid), 500);
  }
  for (const pid of [...avatars.keys()]) if (!players[pid]) { const a = avatars.get(pid); if (a.seat !== null) seatTaken.delete(a.seat); avatars.delete(pid); R.removePerson(pid); }
}
const plist = () => Object.entries(players).filter(([, p]) => p && p.name).map(([id, p]) => ({ id, ...p, team: p.team ? 1 : 0, score: p.score || 0 }));
function teamStats() {
  const L = plist();
  return [0, 1].map(t => { const m = L.filter(p => p.team === t); return { n: m.length, avg: m.length ? Math.round(m.reduce((s, p) => s + p.score, 0) / m.length) : 0 }; });
}

/* ---------- caméra ---------- */
let baseCam = 'lobby';
function setCam(k) { baseCam = k; if (!saying) R.cam(k); }

/* ---------- étapes ---------- */
const steps = [{ k: 'lobby' }];
GAME.acts.forEach((a, ai) => { steps.push({ k: 'intro', ai }); a.qs.forEach((q, qi) => steps.push({ k: 'q', ai, qi })); });
steps.push({ k: 'final' });
let S = { gid: newGameId(), step: 0, phase: null, sound: true, t0: null, timer: null, awarded: {} };
const cur = () => steps[S.step], act = () => GAME.acts[cur().ai], qq = () => act().qs[cur().qi];
const KEY = () => answerKey(S.gid, S.step);
let answers = {}, unsubA = null, botTimers = [];
/* places déjà prises pendant la question (personne ne se superpose) ; les profs comptent */
const PROF_SPOTS = [{ x: -2.7, z: -5.3 }, { x: .5, z: -5.4 }];
let spotTaken = [...PROF_SPOTS];

function publish(extra = {}) {
  const st = cur(), o = { gid: S.gid, step: S.step, kind: st.k, phase: S.phase || null, key: KEY(), teams: GAME.teams.map(t => t.name), v: Date.now() };
  if (st.ai !== undefined) { const a = act(); o.act = { i: st.ai, n: GAME.acts.length, name: a.name, rule: a.rule, type: a.type }; }
  if (st.k === 'q') { const q = qq(); o.q = { text: q.q, opts: q.opts || null, t: q.t, idx: st.qi, n: act().qs.length, type: act().type }; if (S.phase === 'reveal') o.reveal = { ok: q.ok ?? null, val: q.val ?? null, why: q.why }; }
  net.setState(Object.assign(o, extra));
}

let sayTok = 0;
/* minuterie annulée dès qu'on appuie sur Suivant (évite les voix en double) */
const later = (ms, fn) => { const t = sayTok; setTimeout(() => { if (t === sayTok) fn(); }, ms); };
function hush() { sayQ = []; sayTok++; saying = false; $('cap').classList.remove('on'); try { speechSynthesis.cancel(); } catch (e) { } if (curAudio) { try { curAudio.pause(); curAudio.src = ''; } catch (e) { } curAudio = null; } ['M', 'P', 'K', 'Mi'].forEach(id => R.talk(id, 0)); bubbles.forEach(el => el._until = 0); }
function go(i) {
  S.step = Math.max(0, Math.min(steps.length - 1, i)); S.phase = null; clearTimer(); stopBots(); hush();
  if (unsubA) { unsubA(); unsubA = null; } answers = {}; spotTaken = [...PROF_SPOTS];
  if (S.step > 0 && S.t0 === null) S.t0 = performance.now();
  enter(); publish(); render();
}
function enter() {
  const st = cur();
  document.body.classList.toggle('lobby', st.k === 'lobby');
  document.body.classList.remove('withjoin');
  R.setZones(false); R.setLine(false); R.setFlag(null); R.setVisible('K', false); R.setVisible('Mi', false);
  R.moveTo('M', -2.7, -5.3, { face: 0 }); R.moveTo('P', .5, -5.4, { face: 0 });
  banner('');
  if (st.k === 'lobby') { setCam('lobby'); avatars.forEach((a, pid) => goHome(pid)); R.setScreen({ top: GAME.title, main: 'Scannez le code QR pour rejoindre la partie', foot: 'Code : ' + ROOM }); later(1200, () => { if (cur().k === 'lobby') { narrate(NARR.welcome); say(LINES.lobby); } }); }
  if (st.k === 'intro') {
    const a = act(); setCam('wide'); avatars.forEach((x, pid) => goHome(pid, Math.random() * .8));
    banner(a.name, `Activité ${st.ai + 1} sur ${GAME.acts.length} · ${a.bloc}`, 2600);
    R.setScreen({ top: `Activité ${st.ai + 1} · ${a.name}`, main: a.rule, foot: 'Rejoindre : code ' + ROOM });

const joinURL = new URL('player.html?r=' + ROOM, location.href).href;
$('code').textContent = ROOM; $('url').textContent = joinURL.replace(/^https?:\/\//, '');
try { const qr = qrcode(0, 'M'); qr.addData(joinURL); qr.make(); $('qr').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); } catch (e) { $('qr').textContent = 'QR indisponible'; }

/* ---------- contrôles ---------- */
function next() { const st = cur(); if (st.k === 'q' && S.phase !== 'reveal') { if (S.phase === 'scene') return; reveal(); return; } if (st.k === 'final') return; go(S.step + 1); }
$('bNext').onclick = next;
const toggleSound = () => { S.sound = !S.sound; flash('Voix : ' + (S.sound ? 'oui' : 'non')); if (!S.sound) hush(); };
const full = () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => { }); } catch (e) { } };
let hq = true; const toggleQ = () => { hq = !hq; R.setQuality(hq); R.resize(innerWidth, innerHeight); flash('Qualité : ' + (hq ? 'haute' : 'réduite')); };
function flash(t) { banner(t, '', 1200); }
let resetArm = 0;
async function resetGame() {
  if (Date.now() - resetArm > 3000) { resetArm = Date.now(); flash('Nouvelle partie ? Appuyez encore sur N'); return; }
  await net.clearRoom(); snapLast = ''; pubWorld(); S.gid = newGameId(); bots = []; S.awarded = {}; S.raceWinSaid = false; S.t0 = null; avatars.forEach((a, pid) => R.removePerson(pid)); avatars.clear(); seatTaken.clear(); go(0);
}
$('lobbyCols').addEventListener('click', e => { const b = e.target.closest('[data-kick]'); if (b) net.removePlayer(b.dataset.kick); });
addEventListener('keydown', e => {
  const k = e.code;
  if (['Space', 'ArrowRight', 'PageDown', 'Enter'].includes(k)) { e.preventDefault(); if (e.target.tagName === 'BUTTON' && (k === 'Space' || k === 'Enter')) return; next(); }
  else if (['ArrowLeft', 'PageUp'].includes(k)) { e.preventDefault(); go(S.step - 1); }
  else if (k === 'KeyB') addBots(12);
  else if (k === 'KeyS') toggleSound();
  else if (k === 'KeyF') full();
  else if (k === 'KeyQ') toggleQ();
  else if (k === 'KeyN') resetGame();
});

/* ---------- boucle ---------- */
let last = performance.now();
/* ---------- synchronisation : le projecteur publie l'état exact de la salle ----------
   Instantané compact de tous les personnages, 5 fois par seconde tant que quelque chose bouge
   (rien n'est envoyé quand tout est immobile). Les téléphones l'affichent tel quel. */
const SID = Math.random().toString(36).slice(2, 8);           // identifie ce projecteur (rechargement = nouveau)
let snapLast = '';
setInterval(() => publishSnap(performance.now()), 200);   // cadence régulière, indépendante des images par seconde
function packAll() {
  const a = {}, T = R.T;
  R.people.forEach((p, id) => {
    if (!avatars.has(id) && !['M', 'P', 'K', 'Mi'].includes(id)) return;
    a[id] = packPerson({ x: p.x, z: p.z, yaw: p.yaw, sitting: p.sitting, walking: p.walking, react: p.react && p.react.until > T ? p.react.kind : null, talk: p.talk > T, hidden: !p.root.visible });
  });
  return a;
}
function publishSnap(now, force) {
  const a = packAll(), j = JSON.stringify(a);
  if (!force && j === snapLast) return;
  snapLast = j; net.setSnap({ t: Math.round(now), sid: SID, a });
}
/* état du décor (zones, ligne, drapeau, tableau) : publié à chaque changement */
const WORLD = { zones: [false, -1], line: false, flag: null, screen: { main: 'Bienvenue' } };
let worldQ = false;
const pubWorld = () => { if (worldQ) return; worldQ = true; queueMicrotask(() => { worldQ = false; net.setWorld({ ...WORLD, sid: SID }); }); };
{
  const z = R.setZones, l = R.setLine, f = R.setFlag, sc = R.setScreen;
  R.setZones = (show, hi = -1) => { z(show, hi); WORLD.zones = [!!show, hi]; pubWorld(); };
  R.setLine = show => { l(show); WORLD.line = !!show; pubWorld(); };
  R.setFlag = v => { f(v); WORLD.flag = v ?? null; pubWorld(); };
  R.setScreen = lines => { sc(lines); WORLD.screen = { top: lines.top || '', main: lines.main || '', foot: lines.foot || '' }; pubWorld(); };
}
function frame(now) {
  const raw = (now - last) / 1000, dt = Math.min(.05, raw); last = now;
  if (S.timer) {
    S.timer.left -= Math.min(raw, 1); const l = Math.max(0, S.timer.left);
    $('arc').style.strokeDashoffset = 213.6 * (1 - l / S.timer.total); $('ringT').textContent = Math.ceil(l); $('ring').classList.toggle('low', l <= 5);
    if (S.timer.left <= 0) closeQ();
  }
  if (S.t0 !== null) { const e = (now - S.t0) / 1000, f = v => String(Math.floor(v)).padStart(2, '0'); $('clock').innerHTML = `${f(e / 60)}:${f(e % 60)}<em>sur ${f(GAME.minutes)}:00</em>`; $('clock').style.color = e > GAME.minutes * 60 ? '#ff8a7a' : ''; }
  if (!window.__pause) { if (raw > .06) R.advance(Math.min(raw, 2) - dt); R.tick(dt); } /* déplacements en temps réel même à faible FPS */
  placeBubbles();
  requestAnimationFrame(frame);
}
net.onPlayers(v => { players = v || {}; syncAvatars(); renderHUD(); if (cur().k === 'lobby') renderLobby(); });
go(0); requestAnimationFrame(t => { last = t; frame(t); });
window.__host = { addBots, next, go, S, R, cur, steps, players: () => players, answers: () => answers, publishSnap: () => publishSnap(performance.now(), true), reset: () => { resetArm = Date.now(); return resetGame(); }, snap: (n = 1, dt = .05) => { for (let i = 0; i < n; i++) R.tick(dt); return $('stage').toDataURL('image/jpeg', .85); } };
</script>
</body>
