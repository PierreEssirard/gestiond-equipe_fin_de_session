<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1113">
<title>Choc des cultures · joueur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE télécommande de jeu télé : rapide, gros boutons, zéro friction
   IDEA la manette du plateau, aux couleurs de votre équipe
   PICTURE les quatre grands boutons de réponse qui remplissent l'écran
   COLOUR graphite, couleur d'équipe en bandeau, jaune signal, quatre couleurs de coins
   TYPE Barlow Condensed (titres, chiffres) + Barlow (texte)
   LAYOUT une colonne : bandeau équipe, question, boutons jusqu'en bas */
:root{color-scheme:dark;--bg:#0c1113;--card:#161d21;--edge:rgba(255,255,255,.12);--ink:#f3f5f6;--mut:#a3afb5;--acc:#ffd34d;--ok:#2fb36a;--ko:#d8453a;--tc:#555}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:500 17px/1.4 Barlow,system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh;padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;background:var(--tc);color:#fff;flex:none}
header b{font:800 21px/1 "Barlow Condensed",sans-serif;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header span{font:800 21px/1 "Barlow Condensed",sans-serif;text-align:right;font-variant-numeric:tabular-nums}
header span small{font:600 13px Barlow,sans-serif;opacity:.85;margin-right:6px}
#stage{position:relative;flex:1 1 auto;min-height:0;display:none;background:#0c1113;overflow:hidden}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
body.s3d #stage{display:block}
body.s3d main{flex:0 0 auto;max-height:46%}
body.s3d.split #stage{flex:0 0 24%}
body.s3d.split h2{font-size:22px}
body.s3d.split main{gap:9px;padding-top:12px}
body.s3d.split main{flex:1 1 auto;max-height:none}
#load{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:12px;background:radial-gradient(120% 90% at 50% 40%,#1c262a 0%,#0c1113 75%);color:var(--mut);font-weight:600;transition:opacity .6s,visibility 0s linear .6s;z-index:3}
#load i{display:block;width:min(220px,60vw);height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
#load i b{display:block;height:100%;width:6%;background:var(--acc);transition:width .3s}
#load.off{opacity:0;visibility:hidden;pointer-events:none}
#chip{position:absolute;left:50%;top:12px;transform:translateX(-50%);padding:7px 14px;border-radius:99px;background:rgba(12,17,19,.86);font:700 15px/1.2 Barlow,sans-serif;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;transition:opacity .3s}
#chip:empty{opacity:0}
#big{position:absolute;left:0;right:0;bottom:14px;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none;opacity:0;transform:translateY(12px);transition:opacity .4s,transform .4s;text-shadow:0 2px 14px rgba(0,0,0,.7)}
#big.on{opacity:1;transform:none}
#big .ok{color:var(--ok)}#big .ko{color:var(--ko)}
#big .r{font:800 46px/1 "Barlow Condensed",sans-serif}
#big .p{font:800 30px/1 "Barlow Condensed",sans-serif;color:var(--acc)}
#tog{min-height:0;padding:6px 11px;font:800 14px/1 "Barlow Condensed",sans-serif;border-radius:99px;background:rgba(0,0,0,.25);color:#fff;border:1px solid rgba(255,255,255,.35);display:none;flex:none}
body.joined #tog{display:block}
main{flex:1;display:flex;flex-direction:column;gap:12px;padding:14px 16px 16px;overflow:auto}
.card{display:flex;flex-direction:column;gap:6px}
h1{margin:0;font:800 34px/1.02 "Barlow Condensed",sans-serif;text-wrap:balance}
h2{margin:0;font:700 25px/1.12 "Barlow Condensed",sans-serif;text-wrap:balance}
.kick{color:var(--acc);font-weight:700;font-size:15px}
p{margin:0}.mut{color:var(--mut)}
input[type=text]{width:100%;font:600 20px Barlow,sans-serif;padding:14px;border-radius:12px;border:2px solid var(--edge);background:var(--card);color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--acc)}
button{font:700 19px/1.15 Barlow,sans-serif;min-height:56px;padding:12px 16px;border-radius:14px;border:0;background:var(--acc);color:#111;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.98)}
button:disabled{opacity:.45}
.grid{display:grid;gap:8px;flex:1;grid-template-rows:repeat(4,minmax(52px,1fr))}
.ans{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:var(--c);color:#111;font-size:18px;padding:10px 14px}
.ans b{display:grid;place-items:center;width:52px;height:52px;border-radius:10px;background:rgba(0,0,0,.18);font:800 32px/1 "Barlow Condensed",sans-serif}
.vf{display:grid;grid-template-rows:1fr 1fr;gap:12px;flex:1}
.vf button{font:800 44px/1 "Barlow Condensed",sans-serif}
.vf button small{display:block;font:600 16px Barlow,sans-serif;margin-top:6px}
.vf .t{background:var(--ok);color:#fff}.vf .f{background:var(--ko);color:#fff}
.slider{display:flex;flex-direction:column;gap:16px;flex:1;justify-content:center}
.slider output{font:800 96px/1 "Barlow Condensed",sans-serif;text-align:center;color:var(--acc);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:56px;accent-color:var(--acc)}
.scale{display:flex;justify-content:space-between;color:var(--mut);font-weight:700}
.state{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;padding:12px}
.state .mega{font:800 76px/1 "Barlow Condensed",sans-serif}
.pill{display:inline-block;padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--edge);font-weight:700}
.why{background:var(--card);border-left:4px solid var(--acc);padding:12px 14px;border-radius:0 12px 12px 0;text-align:left}
.ok{color:var(--ok)}.ko{color:var(--ko)}
.av{display:flex;align-items:center;gap:8px}
.av span{margin-right:auto;color:var(--mut);font-weight:700;font-size:15px;white-space:nowrap}
.av span em{font-style:normal;color:var(--acc)}
.av button{min-height:46px;padding:8px 18px;font-size:17px;background:var(--card);color:var(--ink);border:2px solid var(--edge)}
.av button[aria-checked=true]{background:var(--acc);border-color:var(--acc);color:#111}
.team{width:100%;padding:22px;border-radius:16px;background:var(--tc);color:#fff;text-align:center}
.team strong{display:block;font:800 52px/1 "Barlow Condensed",sans-serif}
.foot{color:var(--mut);font-size:13px;text-align:center;padding:0 16px 10px}
</style>
</head>
<body>
<header id="hd"><b>Choc des cultures</b><span id="me"></span><button id="tog" aria-label="Changer de vue">2D</button></header>
<div id="stage"><canvas id="cv"></canvas><div id="load"><span id="loadT">Préparation de la salle 3D…</span><i><b id="loadB"></b></i></div><div id="chip"></div><div id="big"><div class="r" id="bigR"></div><div class="p" id="bigP"></div></div></div>
<main id="m"><div class="state"><p class="mut">Connexion…</p></div></main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import { GAME } from './config.js?v=23';
import { connect } from './net.js?v=23';
import { pruneSent, phoneMode, hash, sampleSnaps, makeClock } from './logic.js?v=23';
import { genreDuPrenom } from './prenoms.js?v=23';
import { LOOK, genreDe, choisirTenue, tenue } from './avatars.js?v=23';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const m = $('m');
const params = new URLSearchParams(location.search);
let ROOM = (params.get('r') || '').toUpperCase().replace(/[^A-Z]/g, '');

if (!ROOM) {
  m.innerHTML = `<h1>Rejoindre la partie</h1><p class="mut">Entrez le code affiché à l’écran.</p><input type="text" id="code" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD"><button id="go">Continuer</button>`;
  $('go').onclick = () => { const c = $('code').value.toUpperCase().replace(/[^A-Z]/g, ''); if (c.length === 4) location.search = '?r=' + c; };
} else start();

async function start() {
  const net = await connect(ROOM);
  if (net.mode === 'local') { const w = document.createElement('div'); w.style.cssText = 'background:#ffd34d;color:#111;font:700 13px/1.3 Barlow,sans-serif;padding:8px 14px;text-align:center;flex:none'; w.textContent = 'Mode répétition : ce téléphone n’est pas relié au projecteur.'; document.body.insertBefore(w, $('stage')); }
  let pid; try { pid = localStorage.getItem('choc:pid:' + ROOM); } catch (e) { }
  if (!pid) { pid = 'p' + Math.random().toString(36).slice(2, 10); try { localStorage.setItem('choc:pid:' + ROOM, pid); } catch (e) { } }
  if (params.get('pid')) pid = params.get('pid');
  let me = null, players = {}, state = null, sent = {};
  try { sent = JSON.parse(localStorage.getItem('choc:sent:' + ROOM) || '{}'); } catch (e) { }
  const saveSent = () => { try { localStorage.setItem('choc:sent:' + ROOM, JSON.stringify(sent)); } catch (e) { } };
  let lineVal = 50, joining = false;
  let want3d = true; try { localStorage.removeItem('choc:2d'); } catch (e) { }
  if (params.get('2d')) want3d = false;

  /* ---------- salle 3D (vue allégée pour téléphone) ---------- */
  let V = null, booting = false;
  async function boot3d() {
    if (V || booting || !want3d) return; booting = true;
    try {
      const mod = await import('./scene.js?v=23');
      V = makeView(mod);
    } catch (e) { console.warn('3D indisponible', e); want3d = false; }
    booting = false; render(); if (V) V.sync();
  }
  function makeView({ createClassroom }) {
    const cv = $('cv');
    const R = createClassroom(cv, { room: params.get('room') === '0' ? false : undefined, lite: true, labelScale: .055, corners: GAME.corners, preload: ['louise', 'joe', 's_ben', 's_kate', 's_jody', 's_megan', 's_suzie', 's_leonard'] });
    /* mêmes personnages que le projecteur ; leur état vient uniquement des instantanés publiés par le projecteur */
    const PROF = { M: 'louise', P: 'joe', K: 'leonard', Mi: 'ben' };
    const looks = new Map();   // tenue affichée pour chaque joueur (celle choisie par le projecteur, enregistrée avec le joueur)
    /* l'écran de chargement reste tant que la salle, les personnages et leurs shaders ne sont pas prêts
       et que les images ne s'enchaînent pas régulièrement : on ne voit jamais la 3D se construire */
    const loadTick = setInterval(() => { $('loadB').style.width = Math.round(6 + R.progress * 88) + '%'; }, 200);
    Promise.race([R.ready.then(() => { $('loadT').textContent = 'Presque prêt…'; return R.settled; }), new Promise(r => setTimeout(r, 30000))]).then(() => {
      clearInterval(loadTick); $('loadB').style.width = '100%'; window.__loadDone = { room: R.room, t: performance.now() };
      setTimeout(() => $('load').classList.add('off'), 150);
    });
    const clock = makeClock(); let buf = [], lastWorld = null;
    const DELAY = 300; // ms de retard d'affichage : absorbe les irrégularités du réseau
    net.onSnap(sn => {
      if (!sn || !sn.a) return;
      if (clock.sample(sn.t, performance.now(), sn.sid)) buf = [];
      if (buf.length && sn.t <= buf[buf.length - 1].t) return;
      buf.push(sn); if (buf.length > 40) buf.splice(0, buf.length - 40);
    });
    function applyWorld(w) {
      if (!w) return; lastWorld = w;
      R.setZones(!!w.zones?.[0], w.zones?.[1] ?? -1); R.setLine(!!w.line); R.setFlag(w.flag ?? null);
      if (w.screen) R.setScreen(w.screen);
    }
    net.onWorld(applyWorld);
    function ensure(id) {
      const p = players[id];
      if (R.people.has(id)) {
        if (p && LOOK[p.look] && looks.has(id) && looks.get(id) !== p.look) { R.removePerson(id); looks.delete(id); }   // tenue définitive arrivée
        else return true;
      }
      if (PROF[id]) { R.addPerson(id, { model: PROF[id] }, { fast: true }); return true; }
      if (!p || !p.name) return false;
      const mine = id === pid, team = p.team ? 1 : 0, key = LOOK[p.look] ? p.look : choisirTenue(id, genreDe(p));
      looks.set(id, key);
      R.addPerson(id, tenue(key, id), { label: mine ? 'Toi' : undefined, me: mine, color: GAME.teams[team].color });
      return true;
    }
    function step() {
      const now = performance.now(), ht = clock.toHost(now);
      if (ht === null || !buf.length) return;
      const rt = ht - DELAY;
      while (buf.length > 2 && buf[1].t < rt - 1000) buf.shift();
      const st = sampleSnaps(buf, rt);
      for (const id in st) if (ensure(id)) R.drive(id, st[id]);
      for (const id of R.people.keys()) if (!st[id] && !PROF[id]) { R.removePerson(id); looks.delete(id); }
    }
    /* caméra : toujours sur son propre joueur (de face pour voir sa réaction au résultat) */
    let curView = null;
    function view() {
      const k = state && (state.phase === 'reveal' || state.kind === 'final') ? 'front' : 'back';
      if (!R.people.has(pid)) { if (curView !== 'wide') { curView = 'wide'; R.cam('wide'); } return; }
      if (curView === k) return; curView = k; R.follow(pid, k);
    }
    function sync() { view(); }
    const fit = () => { const r = $('stage').getBoundingClientRect(); if (r.width > 0) R.resize(Math.round(r.width), Math.round(r.height)); };
    new ResizeObserver(fit).observe($('stage')); fit();
    R.cam('wide', true);
    let last = performance.now();
    const frame = t => {
      const raw = (t - last) / 1000; last = t;
      step(); view();
      if (!document.hidden && document.body.classList.contains('s3d') && !window.__pause) R.tick(Math.min(.05, raw));
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
    window.__phone = { R, buf: () => buf, clock, step, snap: (n = 1, dt = .05) => { for (let i = 0; i < n; i++) { step(); R.tick(dt); } return cv.toDataURL('image/jpeg', .85); } };
    return { sync, R };
  }

  $('tog').onclick = () => {
    want3d = !want3d;
    render(); if (V && want3d) V.sync();
  };


  const team = () => (me && me.team) ? 1 : 0;
  function rank() {
    const L = Object.values(players).filter(p => p && p.name).map(p => p.score || 0).sort((a, b) => b - a);
    return { r: L.indexOf((me && me.score) || 0) + 1, n: L.length };
  }
  function renderHead() {
    if (!me || !me.name) { document.body.style.setProperty('--tc', '#1c2429'); $('me').innerHTML = ''; return; }
    const T = GAME.teams[team()]; document.body.style.setProperty('--tc', T.color);
    $('hd').querySelector('b').textContent = me.name + ' · ' + T.name;
    $('me').innerHTML = `${me.score || 0}<small> pts</small>`;
  }
  function layout(split) {
    const on = !!(want3d && me && me.name);
    document.body.classList.toggle('joined', !!(me && me.name));
    $('tog').textContent = want3d ? '2D' : '3D';
    document.body.classList.toggle('s3d', on);
    document.body.classList.toggle('split', on && !!split);
  }
  const chip = t => { $('chip').textContent = t || ''; };
  function big(r, p, cls) { const b = $('big'); if (!r) { b.classList.remove('on'); return; } $('bigR').textContent = r; $('bigR').className = 'r ' + (cls || ''); $('bigP').textContent = p || ''; b.classList.add('on'); }

  function joinForm() {
    m.innerHTML = `<h1>Choc des cultures</h1><p class="mut">Le jeu de l’équipe Charlie. Entrez votre prénom pour rejoindre la partie.</p>
      <input type="text" id="nm" maxlength="18" autocomplete="given-name" placeholder="Votre prénom">
      <div class="av" role="radiogroup" aria-label="Votre avatar"><span id="avh">Votre avatar</span><button type="button" role="radio" data-g="m" aria-checked="false">Homme</button><button type="button" role="radio" data-g="f" aria-checked="false">Femme</button></div>
      <button id="jn">Rejoindre</button>`;
    /* avatar homme ou femme deviné d'après le prénom pendant la saisie ; un appui sur Homme ou Femme le corrige */
    let gChoisi = null, gDevine = null;
    const showG = () => {
      const g = gChoisi || gDevine;
      m.querySelectorAll('.av button').forEach(b => b.setAttribute('aria-checked', String(b.dataset.g === g)));
      $('avh').innerHTML = g ? 'Votre avatar' : $('nm').value.trim() ? 'Avatar <em>à choisir</em>' : 'Votre avatar';
    };
    $('nm').oninput = () => { gDevine = genreDuPrenom($('nm').value); showG(); };
    m.querySelectorAll('.av button').forEach(b => b.onclick = () => { gChoisi = b.dataset.g; showG(); });
    const go = async () => {
      const name = $('nm').value.trim().replace(/\s+/g, ' ').slice(0, 18); if (!name || joining) return; joining = true;
      const c = [0, 0]; Object.values(players).forEach(p => { if (p && p.name) c[p.team ? 1 : 0]++; });
      const g = gChoisi || genreDuPrenom(name);
      await net.join(pid, { name, team: c[0] <= c[1] ? 0 : 1, score: 0, joined: Date.now(), ...(g ? { g } : {}) });
      joining = false;
    };
    $('jn').onclick = go; $('nm').onkeydown = e => { if (e.key === 'Enter') go(); };
  }

  function send(v) {
    if (!state || state.kind !== 'q' || state.phase !== 'open' || sent[state.key] !== undefined) return;
    sent[state.key] = v; saveSent(); net.answer(state.key, pid, v); try { navigator.vibrate && navigator.vibrate(30); } catch (e) { } render();
  }
  const label = v => { const q = state.q; if (q.type === 'line') return v; if (q.type === 'standsit') return v ? 'Vrai' : 'Faux'; return GAME.corners[v].l + ' · ' + q.opts[v]; };
  const short = v => { const q = state.q; if (q.type === 'line') return String(v); if (q.type === 'standsit') return v ? 'Vrai' : 'Faux'; return GAME.corners[v].l; };

  function render() {
    renderHead();
    if (!me || !me.name) { layout(false); if (!$('nm')) joinForm(); return; }
    boot3d();
    const s = state, T = GAME.teams[team()], D = !!want3d;
    big(null);
    const done = (html, split = false, c = '') => { layout(split); chip(D ? c : ''); m.innerHTML = html; };
    if (!s || s.kind === 'lobby') {
      if (D) return done(`<div class="card"><h2>Vous êtes dans la salle</h2><p class="mut">Votre équipe : <b style="color:${T.color}">${esc(T.name)}</b> · ${esc(T.tag)}. Regardez l’écran.</p></div>`, false, 'En attente du départ');
      return done(`<div class="state"><div class="team"><span>Vous jouez pour</span><strong>${esc(T.name)}</strong><span>${esc(T.tag)}</span></div><h2>Regardez l’écran, la partie va commencer.</h2><p class="mut">Gardez cette page ouverte.</p></div>`);
    }
    if (s.kind === 'intro') {
      if (D) return done(`<div class="card"><div class="kick">Activité ${s.act.i + 1} sur ${s.act.n}</div><h2>${esc(s.act.name)}</h2><p class="mut">${esc(s.act.rule)}</p></div>`, false, 'Écoutez la consigne');
      return done(`<div class="kick">Activité ${s.act.i + 1} sur ${s.act.n}</div><h1>${esc(s.act.name)}</h1><p>${esc(s.act.rule)}</p><div class="state"><span class="pill">Préparez-vous</span></div>`);
    }
    if (s.kind === 'final') {
      const { r, n } = rank();
      if (D) { done(`<div class="card"><h2>${r}<sup>e</sup> sur ${n} · ${me.score || 0} points</h2><p class="mut">Merci d’avoir joué !</p></div>`, false, 'Résultat final'); return; }
      return done(`<div class="state"><span class="kick">Résultat final</span><div class="mega">${r}<sup style="font-size:.4em">e</sup></div><h2>sur ${n} joueurs · ${me.score || 0} points</h2><div class="team"><span>Votre équipe</span><strong>${esc(T.name)}</strong></div><p class="mut">Merci d’avoir joué ! Regardez l’écran pour le résultat des équipes.</p></div>`);
    }
    const q = s.q, mine = sent[s.key];
    if (s.phase === 'scene') {
      if (D) return done(`<div class="card"><p class="mut">Regardez la scène. La question arrive juste après : soyez rapide !</p></div>`, false, 'Scène · Klaus et Mike');
      return done(`<div class="kick">${esc(s.act.name)}</div><div class="state"><span class="pill">Scène</span><h2>Regardez la scène à l’écran…</h2><p class="mut">La question arrive juste après. Soyez rapide !</p></div>`);
    }
    if (s.phase === 'reveal') {
      const L = me.last && me.last.key === s.key ? me.last : null, Rv = s.reveal || {};
      const good = L ? L.ok : false;
      const ans = q.type === 'line' ? Rv.val : q.type === 'standsit' ? (Rv.ok ? 'Vrai' : 'Faux') : GAME.corners[Rv.ok].l + ' · ' + q.opts[Rv.ok];
      const head = mine === undefined ? 'Pas de réponse' : good ? 'Bien joué' : 'Raté';
      if (D) {
        done(`<div class="card"><p><b>${q.type === 'line' ? 'Score réel' : 'Réponse'} : ${esc(ans)}</b>${q.type === 'fusion' && s.result ? ` · ${s.result.fusion ? 'fusion réussie' : 'fusion ratée'}` : ''}</p></div>`, false, '');
        big((mine === undefined ? '' : good ? '✓ ' : '✗ ') + head, L ? '+' + L.pts + ' pts' : '', mine === undefined ? '' : good ? 'ok' : 'ko'); return;
      }
      return done(`<div class="kick">${esc(s.act.name)}</div><div class="state"><div class="mega ${mine === undefined ? '' : good ? 'ok' : 'ko'}">${head}</div>
        <h2>${L ? '+' + L.pts + ' points' : 'Calcul des points…'}</h2>${mine !== undefined ? `<p class="mut">Votre réponse : ${esc(label(mine))}</p>` : ''}
        ${q.type === 'fusion' && s.result ? `<span class="pill">${s.result.fusion ? 'Fusion réussie' : 'Fusion ratée'}</span>` : ''}
        <div class="why"><b>${q.type === 'line' ? 'Score réel' : 'Bonne réponse'} : ${esc(ans)}.</b> ${esc(Rv.why || '')}</div></div>`);
    }
    const mode = phoneMode(s, sent, me);
    if (mode === 'sent' || mode === 'closed' || mode === 'wait') {
      if (D) return done(`<div class="card"><p class="mut">${q.type === 'fusion' ? 'Convainquez votre équipe… et l’autre !' : 'Votre avatar se place dans la salle.'}</p></div>`, false, mode === 'sent' ? '✓ Envoyé : ' + short(mine) : mode === 'closed' ? 'Temps écoulé' : 'Un instant…');
      return done(`<div class="kick">${esc(s.act.name)} · question ${q.idx + 1} sur ${q.n}</div><h2>${esc(q.text)}</h2><div class="state"><span class="pill">${mode === 'sent' ? 'Réponse envoyée' : mode === 'closed' ? 'Temps écoulé' : 'Un instant…'}</span>${mine !== undefined ? `<h2>${esc(label(mine))}</h2>` : ''}<p class="mut">${q.type === 'fusion' ? 'Convainquez votre équipe… et l’autre !' : 'Regardez votre avatar dans la salle.'}</p></div>`);
    }
    let h = `${D ? '' : `<div class="kick">${esc(s.act.name)} · question ${q.idx + 1} sur ${q.n}</div>`}<h2>${esc(q.text)}</h2>`;
    if (q.opts) {
      h += (q.type === 'fusion' ? '<p class="mut">Les deux équipes doivent voter pareil.</p>' : '') +
        `<div class="grid">${q.opts.map((o, i) => `<button class="ans" data-v="${i}" style="--c:${GAME.corners[i].color}"><b>${GAME.corners[i].l}</b><span>${esc(o)}</span></button>`).join('')}</div>`;
    } else if (q.type === 'standsit') {
      h += `<div class="vf"><button class="t" data-v="true">VRAI<small>votre avatar se lève</small></button><button class="f" data-v="false">FAUX<small>votre avatar reste assis</small></button></div>`;
    } else if (q.type === 'line') {
      h += `<div class="slider"><output id="lv">${lineVal}</output><input type="range" id="lr" min="0" max="100" step="1" value="${lineVal}"><div class="scale"><span>0</span><span>50</span><span>100</span></div><button id="lok">Valider ${lineVal}</button></div>`;
    }
    done(h, true, `Question ${q.idx + 1} sur ${q.n}`);
    m.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { const v = b.dataset.v; send(v === 'true' ? true : v === 'false' ? false : +v); });
    if ($('lr')) { $('lr').oninput = e => { lineVal = +e.target.value; $('lv').textContent = lineVal; $('lok').textContent = 'Valider ' + lineVal; }; $('lok').onclick = () => send(lineVal); }
  }
  net.onPlayer(pid, v => { me = v; render(); });
  net.onPlayers(v => { players = v || {}; renderHead(); if (V) V.sync(); });
  net.onState(v => { if (v && v.gid) { const p = pruneSent(sent, v.gid); if (Object.keys(p).length !== Object.keys(sent).length) { sent = p; saveSent(); } } if (state && v && state.step !== v.step) lineVal = 50; const was = state && state.phase; state = v; if (v && v.phase === 'reveal' && was !== 'reveal') try { navigator.vibrate && navigator.vibrate(80); } catch (e) { } render(); if (V) V.sync(); });
  render();
}
</script>
</body>
</html>
